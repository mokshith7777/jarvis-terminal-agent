[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-terminal-agent"
version = "1.0.0"
description = "Terminal-first AI agent with Telegram as a thin remote channel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.13,<4","httpx>=0.27,<1","paramiko>=3.4,<4","python-dotenv>=1.0,<2","typer>=0.12,<1","rich>=13.7,<14"]

[project.scripts]
jarvis = "jarvis_agent.cli.app:main"
jarvis-telegram = "jarvis_agent.telegram.bot:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
